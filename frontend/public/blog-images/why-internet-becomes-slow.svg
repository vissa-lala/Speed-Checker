<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" role="img" aria-label="Network troubleshooting">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="0.5" stop-color="#12233f"/><stop offset="1" stop-color="#07111f"/></linearGradient>
    <linearGradient id="main" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#ef4444"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="1"/></pattern>
  </defs>
  <rect width="400" height="280" rx="30" fill="url(#bg)"/>
  <rect width="400" height="280" rx="30" fill="url(#grid)" opacity=".8"/>
  <circle cx="330" cy="56" r="86" fill="#f59e0b" opacity=".16"/>
  <circle cx="70" cy="238" r="110" fill="#ef4444" opacity=".14"/>
  <path d="M70,210 L140,150 L210,190 L300,90" fill="none" stroke="url(#main)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <circle cx="200" cy="150" r="42" fill="rgba(255,255,255,.08)" stroke="rgba(255,255,255,.18)"/>
  <path d="M176 154 h48" stroke="white" stroke-opacity=".9" stroke-width="8" stroke-linecap="round"/>
  <path d="M200 130 v48" stroke="white" stroke-opacity=".56" stroke-width="8" stroke-linecap="round"/>
  <text x="28" y="42" fill="rgba(255,255,255,.92)" font-family="Arial, sans-serif" font-weight="800" font-size="20">Speed Pings</text>
  <text x="28" y="66" fill="rgba(226,232,240,.72)" font-family="Arial, sans-serif" font-size="13">Network troubleshooting</text>
</svg>